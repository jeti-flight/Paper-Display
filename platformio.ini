board = esp32dev
framework = arduino
lib_deps = 
	paulstoffregen/Time@^1.6.1
	zinggjm/GxEPD2@^1.6.9
	adafruit/Adafruit GFX Library@^1.13.0
	dpoettler/ExtendedChars@^0.1.2
